# project.yml: the XcodeGen spec for the human-like UI tests and the Release
# build graph. SwiftPM cannot host UI test bundles, so this generates
# CreativeApps.xcodeproj (gitignored; never commit or hand-edit it) with one UI
# test bundle per app and the Journeys scheme that runs them all; each journey
# launches .build/apps/<X>App.app by path, which scripts/bundle-apps builds.
#
# The Release scheme (route R1, docs/blueprints/suite.md 2.5) builds the
# targets of AfterGlow.app from the same folders as Package.swift: five
# frameworks (SuiteUI, SuiteModel, SuiteKernel, SuiteShell, and
# CreativeEngines, which compiles only Bundle/Engines/CreativeEngines.swift and
# is the only target linking the creative-core products; SuiteKernel reads
# FlareCore's geometry through it), each <X>Model as a static library, each
# <X>App as an application with the helper run path, and the AfterGlowApp
# launcher. Frameworks are not embedded here: bundle-apps assembles them into
# AfterGlow.app/Contents/Frameworks. Every non-test target of Package.swift
# must be a target here; Tests/SuiteModelTests/BuildGraphTests fails when one
# is missing (it reads the names at two-space indent under `targets:`).
# creative-core's revision must match Package.swift's. scripts/ui-test
# runs the whole thing. To add an app, add a <X>JourneyTests target below and
# list it in the scheme. Every bundle also compiles the app audit
# (UITests/Audit.swift, and the engine and checks in Tests/AppAuditTests, the
# Linux test target that tests them; a new check file there is picked up
# without touching this file; docs/blueprints/app-audit.md). Each bundle
# compiles UITests/Journey*.swift (the shared steps and input helpers) and
# UITests/<target>*.swift, so a feature adds its own
# UITests/<X>JourneyTests+<Area>.swift without touching this file, plus the
# three Foundation-only contract files a journey decodes suite.perf and
# suite.controls with. SuiteJourneyTests runs SuiteUI's gallery inside Library
# (-SuiteGallery) and also compiles SuiteControlInventory, the live rules SJ0
# judges suite.controls by (docs/blueprints/suiteui.md, 4.1).
name: CreativeApps
options:
  bundleIdPrefix: org.creativesuite
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
packages:
  creative-core:
    url: https://github.com/qbtrix/creative-core
    revision: c608d4b72c0c69a1f7b1609642f23059cf8533a7
targetTemplates:
  # Release graph: <X>Model compiles Sources/<X>Model and links SuiteModel,
  # SuiteKernel and the engines through CreativeEngines.
  Model:
    type: library.static
    platform: macOS
    sources: ["Sources/${target_name}"]
    dependencies: [{ target: SuiteModel }, { target: SuiteKernel }, { target: CreativeEngines }]
  # A helper app inside AfterGlow.app/Contents/Helpers/<X>.app finds the
  # frameworks four levels up from its executable.
  App:
    type: application
    platform: macOS
    sources: ["Sources/${target_name}"]
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
    dependencies:
      [{ target: SuiteUI, embed: false }, { target: SuiteShell, embed: false }, { target: SuiteModel, embed: false },
       { target: SuiteKernel, embed: false }, { target: CreativeEngines, embed: false }]
  Journey:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        includes: ["Journey*.swift", "Audit.swift", "${target_name}*.swift"]
      - path: Tests/AppAuditTests
        excludes: ["*Tests.swift", "**/*Tests.swift"]
      - Sources/SuiteUI/Contracts/ContractTypes.swift
      - Sources/SuiteUI/Contracts/FrameProbeRecording.swift
      - Sources/SuiteUI/Contracts/ControlInventorying.swift
targets:
  CreativeEngines:
    type: framework
    platform: macOS
    sources: [Bundle/Engines]
    dependencies:
      [{ package: creative-core, product: FlareCore }, { package: creative-core, product: CoreRaster },
       { package: creative-core, product: CoreColor }]
  SuiteModel: { type: framework, platform: macOS, sources: [Sources/SuiteModel] }
  # The editor kernel (docs/blueprints/suiteui/features/editor-kernel.md):
  # Linux-safe, Foundation and FlareCore only, so it reaches the engines
  # through CreativeEngines like a Model does.
  SuiteKernel:
    type: framework
    platform: macOS
    sources: [Sources/SuiteKernel]
    dependencies: [{ target: CreativeEngines }]
  SuiteUI:
    type: framework
    platform: macOS
    sources: [Sources/SuiteUI]
    dependencies: [{ target: SuiteModel }, { target: SuiteKernel }]
  SuiteShell:
    type: framework
    platform: macOS
    sources: [Sources/SuiteShell]
    dependencies: [{ target: SuiteUI }, { target: SuiteModel }]
  FlareModel: { templates: [Model] }
  DesignModel: { templates: [Model] }
  PhotoModel: { templates: [Model] }
  LibraryModel: { templates: [Model] }
  HaloModel: { templates: [Model] }
  # Each app adds its own Model, linked statically, to the template's
  # frameworks (target lists are appended to the template's).
  FlareApp:
    templates: [App]
    settings: { base: { PRODUCT_NAME: Flare, PRODUCT_MODULE_NAME: FlareApp } }
    dependencies: [{ target: FlareModel }]
  DesignApp:
    templates: [App]
    settings: { base: { PRODUCT_NAME: Design, PRODUCT_MODULE_NAME: DesignApp } }
    dependencies: [{ target: DesignModel }]
  PhotoApp:
    templates: [App]
    settings: { base: { PRODUCT_NAME: Photo, PRODUCT_MODULE_NAME: PhotoApp } }
    dependencies: [{ target: PhotoModel }]
  LibraryApp:
    templates: [App]
    settings: { base: { PRODUCT_NAME: Library, PRODUCT_MODULE_NAME: LibraryApp } }
    dependencies: [{ target: LibraryModel }]
  HaloApp:
    templates: [App]
    settings: { base: { PRODUCT_NAME: Halo, PRODUCT_MODULE_NAME: HaloApp } }
    dependencies: [{ target: HaloModel }]
  # The launcher is AfterGlow.app's own executable: its frameworks sit one
  # level up, in Contents/Frameworks.
  AfterGlowApp:
    type: application
    platform: macOS
    sources: [Sources/AfterGlowApp]
    settings:
      base:
        PRODUCT_NAME: AfterGlow
        PRODUCT_MODULE_NAME: AfterGlowApp
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      [{ target: SuiteUI, embed: false }, { target: SuiteShell, embed: false }, { target: SuiteModel, embed: false },
       { target: SuiteKernel, embed: false }]
  FlareJourneyTests: { templates: [Journey] }
  DesignJourneyTests: { templates: [Journey] }
  PhotoJourneyTests: { templates: [Journey] }
  LibraryJourneyTests: { templates: [Journey] }
  HaloJourneyTests: { templates: [Journey] }
  # A target's sources are appended to the template's.
  SuiteJourneyTests:
    templates: [Journey]
    sources:
      - Sources/SuiteUI/ControlInventory.swift
  # The launcher's journeys (UITests/AfterGlowJourneyTests*.swift, home's
  # feature) decode the suite's shared values.
  AfterGlowJourneyTests:
    templates: [Journey]
    sources:
      - Sources/SuiteModel/Values/
schemes:
  Journeys:
    build:
      targets:
        FlareJourneyTests: [test]
        DesignJourneyTests: [test]
        PhotoJourneyTests: [test]
        LibraryJourneyTests: [test]
        HaloJourneyTests: [test]
        SuiteJourneyTests: [test]
        AfterGlowJourneyTests: [test]
    test:
      targets:
        [FlareJourneyTests, DesignJourneyTests, PhotoJourneyTests, LibraryJourneyTests, HaloJourneyTests, SuiteJourneyTests,
         AfterGlowJourneyTests]
  # scripts/bundle-apps: xcodebuild -scheme Release build. Builds the launcher,
  # the five apps and everything they link, in the Release configuration.
  Release:
    build:
      targets:
        AfterGlowApp: all
        FlareApp: all
        DesignApp: all
        PhotoApp: all
        LibraryApp: all
        HaloApp: all
    run:
      config: Release
    archive:
      config: Release
