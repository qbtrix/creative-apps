# project.yml: the XcodeGen spec for the human-like UI tests, and nothing else.
# SwiftPM cannot host UI test bundles, so this generates CreativeApps.xcodeproj
# (gitignored; never commit or hand-edit it) with one UI test bundle per app
# and the Journeys scheme that runs them all. The apps are not Xcode targets:
# scripts/bundle-apps builds them from the SwiftPM targets in Package.swift,
# and each journey launches .build/apps/<X>App.app by path. scripts/ui-test
# runs the whole thing. To add an app, add a <X>JourneyTests target below and
# list it in the scheme. Every bundle also compiles the app audit
# (UITests/Audit.swift, and the engine and checks in Tests/AppAuditTests, the
# Linux test target that tests them; a new check file there is picked up
# without touching this file; docs/blueprints/app-audit.md). Each bundle
# compiles UITests/Journey*.swift (the shared steps and input helpers) and
# UITests/<target>*.swift, so a feature adds its own
# UITests/<X>JourneyTests+<Area>.swift without touching this file, plus the
# three Foundation-only contract files a journey decodes suite.perf and
# suite.controls with. SuiteJourneyTests runs SuiteUI's gallery inside Library
# (-SuiteGallery) and also compiles SuiteControlInventory, the live rules SJ0
# judges suite.controls by (docs/blueprints/suiteui.md, 4.1).
name: CreativeApps
options:
  bundleIdPrefix: org.creativesuite
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targetTemplates:
  Journey:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        includes: ["Journey*.swift", "Audit.swift", "${target_name}*.swift"]
      - path: Tests/AppAuditTests
        excludes: ["*Tests.swift", "**/*Tests.swift"]
      - Sources/SuiteUI/Contracts/ContractTypes.swift
      - Sources/SuiteUI/Contracts/FrameProbeRecording.swift
      - Sources/SuiteUI/Contracts/ControlInventorying.swift
targets:
  FlareJourneyTests: { templates: [Journey] }
  DesignJourneyTests: { templates: [Journey] }
  PhotoJourneyTests: { templates: [Journey] }
  LibraryJourneyTests: { templates: [Journey] }
  HaloJourneyTests: { templates: [Journey] }
  # A target's sources are appended to the template's.
  SuiteJourneyTests:
    templates: [Journey]
    sources:
      - Sources/SuiteUI/ControlInventory.swift
schemes:
  Journeys:
    build:
      targets:
        FlareJourneyTests: [test]
        DesignJourneyTests: [test]
        PhotoJourneyTests: [test]
        LibraryJourneyTests: [test]
        HaloJourneyTests: [test]
        SuiteJourneyTests: [test]
    test:
      targets:
        [FlareJourneyTests, DesignJourneyTests, PhotoJourneyTests, LibraryJourneyTests, HaloJourneyTests, SuiteJourneyTests]
