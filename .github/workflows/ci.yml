# CI: the Linux job runs scripts/ci (lints, every Model target built and
# tested; Package.swift declares the UI targets on macOS only). The macOS
# side is three jobs on macOS 26: `macOS compile` (scripts/ci --build-only:
# the lints and every target built with its tests, the build shipped to the
# test jobs as the `swift-build` tarball), `macOS tests K/N` (N shards, each
# its own `swift test` process on that build: scripts/ci --shard K/N; the
# snapshots as `snapshots-K`), `macOS bundles` (beside them: the five release
# apps bundled, `app-builds`, a tarball so the executables keep their +x bit,
# and the size report) and `macOS`, the gate job on ubuntu that is green once
# all of them are. Linux
# and macOS are the gate: both must pass for `promote`, and a
# red one opens `dev-red`. The report-only UI journeys (`macOS journeys`,
# `ui-screens`, Findings, Audit lower) are not here: on dev, the last job,
# `Journeys dispatch`, starts a journeys.yml run for this run's commit and
# app, in its own concurrency group, so a journeys job waiting hours for one
# of the org's 1-2 macOS runners never holds this run's `ci-dev` group (and
# with it every later full dev run).
# On a branch: `gh workflow run journeys.yml --ref <branch> [-f app=<app>]`.
#
# Branch model: crew PRs merge into dev through the fast lane on the worker's
# Linux scripts/ci --changed marker. Ready PRs land in batches: the lane runs a
# Linux-only run and, when the batch has code, one macOS gate run (`mac_only`,
# below) on its lane/batch-<id> branch. With the lane's LANE_MAC_PER_PR=1 it
# instead asks a build-only macOS compile per code PR (`build_only`, scoped to
# the PR's apps by `app`). This workflow runs on dev once a feature is built: on
# workflow_dispatch (the supervisor, Belt, or the lane after a `feature-done`
# or UI merge) and daily as a safety net. Green Linux and macOS jobs let `promote`
# fast-forward main to that exact SHA. A red Linux or macOS job makes `dev-red` open
# or update one "dev is red" issue with the culprit range main..SHA; the next
# promotion closes it. No push trigger; pull_request runs only for rare
# hotfix PRs to main.
#
# Perf and timing tests (Tests/perf-suites.txt) never run here: scripts/ci
# and scoped runs skip them, and they run nightly on the captain's Mac
# (perf-nightly).
#
# Scoped run (workflow_dispatch with `app`: flare, design, photo, library,
# halo, suite or suiteui): the compile job builds every target, one test job
# (`macOS tests 1/1`) runs only that app's Model and snapshot tests (suite:
# SuiteModel, SuiteKernel and the CLI's tests), and the gate job is
# `macOS (<app>)`. On dev, `Journeys dispatch` then starts that app's journeys
# in journeys.yml. The Linux job is skipped; a scoped run never
# promotes, opens dev-red or lowers the audit baseline. verify-dispatch.sh
# starts one per app after its merges.
#
# macOS gate run (workflow_dispatch with `mac_only`, the lane's batch check):
# only the macOS compile and test jobs, scripts/ci in full (sharded), or with
# `app` (a comma list) the scoped step over the union of those apps' tests. No Linux job (the lane
# dispatches its own Linux-only run), no bundles or size report, no journeys;
# it never promotes, opens dev-red or lowers the audit baseline.
#
# The fast lane reads the job names "Linux", "macOS" (also "macOS (<apps>)")
# and "macOS build" and the run titles "macOS build" and "macOS gate*", and
# ignores "macOS journeys" (with or without " (<app>)", journeys.yml's job), so
# keep them stable. "macOS compile", "macOS tests K/N" and "macOS bundles" fit none of those
# (the sentinel counts every job starting with "macOS" as a macOS run).
name: CI
# A build-only run (the fast lane's compile check for code PRs), a Linux-only
# run (the lane's check on a head it integrated or a batch), a macOS gate run
# (a lane batch's macOS check, "macOS gate" or "macOS gate: <apps>"; the lane
# counts its queued and running ones against its slots) and a scoped run
# ("scoped: <app>", how verify-dispatch.sh finds them) get their own titles;
# " " keeps the default title.
run-name: "${{ inputs.build_only && 'macOS build' || inputs.linux_only && 'Linux check' || inputs.mac_only && format('macOS gate{0}', inputs.app && format(': {0}', inputs.app) || '') || inputs.app && format('scoped: {0}', inputs.app) || ' ' }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Only build every target on macOS (the fast lane's compile check for code PRs)
        type: boolean
        default: false
      linux_only:
        description: Only the Linux job (the fast lane's check on a PR head it integrated itself; no macOS job, so no findings get filed for a branch)
        type: boolean
        default: false
      promote:
        description: A full dev run in its own concurrency group, so later dev dispatches don't replace it while it waits for a macOS runner
        type: boolean
        default: false
      mac_only:
        description: Only the macOS job (the fast lane's macOS gate on a batch branch; with app, a comma list)
        type: boolean
        default: false
      app:
        description: 'Scope to one app: flare, design, photo, library, halo, suite or suiteui (empty: the full run). With build_only: a comma list of flare, design, photo, library, halo. With mac_only: a comma list of any of them'
        type: string
        default: ''
  schedule:
    - cron: '17 4 * * *'  # daily; schedule runs on the default branch (dev)

permissions:
  contents: read

# Runs on dev and main never cancel a running run: GitHub keeps the running
# one plus the newest pending one and cancels a superseded pending one, so
# dispatches that pile up collapse into one run (macOS runners are a small
# shared pool). A running full run is not cancelled because dev is dispatched
# every 15 to 45 minutes and its macOS jobs took 50 to 90: cancelling would
# starve promote (so were its macOS jobs; the shards are shorter). PR runs group by PR number, so a
# hotfix PR from a branch named dev can't cancel a dev run. Each scoped app
# gets its own group, so a Design run never displaces a pending Photo or full
# run. A branch's build-only runs share one group whatever their `app`, so a
# new head's build cancels the old head's (the lane reads the build by head,
# and an old head's build is no longer the one it waits on). A `promote` run
# (a full dev run the fast lane or the captain starts to move main) has its own
# group: GitHub keeps one pending run per group, so without it every later dev
# dispatch replaced the waiting full run and, with a long macOS queue, no full
# dev run ever finished for Promote to fast-forward main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}${{ inputs.build_only && '-build' || '' }}${{ inputs.linux_only && '-linux' || '' }}${{ inputs.mac_only && '-mac' || '' }}${{ !inputs.build_only && inputs.app && format('-{0}', inputs.app) || '' }}${{ inputs.promote && '-promote' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  linux:
    name: Linux
    if: ${{ !inputs.build_only && !inputs.app && !inputs.mac_only }}
    runs-on: ubuntu-latest
    # Official image; 6.3.3-noble is Ubuntu 24.04, the same OS as the cloud agents.
    container: swift:6.3.3-noble
    # A cold build alone takes 7-8 min and a full pass about 17, so 20 cut slow runners off mid-test.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - { uses: actions/setup-node@v4, with: { node-version: 22 } } # jscpd duplicate check; the swift image has no node
      # scripts/ci's C4 ownership check and the fast lane's decision tests need
      # jq, and its C4 assembly and waves checks need python3; the swift image
      # may lack both.
      - run: apt-get update -q && apt-get install -y -q jq python3
      - run: swift --version
      - run: scripts/ci
      - run: bash Tests/fast_lane/test_fast_lane.sh

  # The fast lane's compile check for a PR that changes code (BUILD_RE in
  # scripts/fast-lane.sh: Swift under Sources/, Tests/ and UITests/,
  # project.yml, Package.swift). It compiles and runs nothing. Only on
  # workflow_dispatch with build_only. With no `app` it builds every SwiftPM
  # target with its tests, then every journey bundle from project.yml. With
  # `app` (a comma list of flare, design, photo, library, halo: what
  # `scripts/test-scope build-apps` gave the lane for the PR's code), it builds
  # per app <X>ModelTests and the <X>App product, plus AppSnapshotTests (every
  # app's snapshot tests, so it links every app and SuiteUI), then only those
  # apps' journey bundles. It skips the other Model tests, SuiteUITests,
  # SuiteModelTests, SuiteKernelTests, AppAuditTests and the CLI: Linux
  # scripts/ci builds all but SuiteUITests, which a one-app change can't
  # break. Any other `app` value builds everything (fail closed).
  mac-build:
    name: macOS build
    if: ${{ inputs.build_only }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # NAMES: the apps' target prefixes (Photo Design), empty for a full build.
      - name: Pick the apps
        env:
          APP: ${{ inputs.app }}
        run: |
          one='(flare|design|photo|library|halo)'
          names=""
          if [[ "$APP" =~ ^$one(,$one)*$ ]]; then
            for a in ${APP//,/ }; do names="$names $(tr a-z A-Z <<<"${a:0:1}")${a:1}"; done
          elif [[ -n "$APP" ]]; then
            echo "::warning::app '$APP' is not a comma list of flare, design, photo, library and halo: building everything"
          fi
          echo "NAMES=${names# }" >>"$GITHUB_ENV"
          echo "### macOS build: ${names:-every target with its tests and every journey bundle}" >>"$GITHUB_STEP_SUMMARY"
      - name: swift build
        run: |
          if [[ -z "$NAMES" ]]; then swift build --build-tests; exit; fi
          swift build --target AppSnapshotTests
          for x in $NAMES; do
            swift build --target "${x}ModelTests"
            swift build --product "${x}App"
          done
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate --quiet
      # build-for-testing ignores -only-testing (it still compiles every
      # bundle), so a scoped build names the bundle targets instead.
      - name: Journey bundles
        run: |
          if [[ -z "$NAMES" ]]; then
            xcodebuild build-for-testing -project CreativeApps.xcodeproj -scheme Journeys -destination platform=macOS
            exit
          fi
          targets=()
          for x in $NAMES; do targets+=(-target "${x}JourneyTests"); done
          xcodebuild build -project CreativeApps.xcodeproj "${targets[@]}" -arch "$(uname -m)"

  # The macOS gate's compile half, for a full or scoped run: every lint and
  # `swift build --build-tests` (scripts/ci --build-only) on macOS 26, then
  # .build goes up as the `swift-build` tarball (tar keeps the +x bits
  # upload-artifact drops; zstd, 860 MB, 13 s each way; one day) for the test
  # jobs. Nothing else: `needs` waits for the whole job, so a step after the
  # upload would hold every shard (the bundles, 10 min, did in run
  # 40275255506). Its name starts with "macOS" so the sentinel counts its
  # queue wait, and is not "macOS build", the build-only job the lane reads.
  mac-compile:
    name: macOS compile
    if: ${{ !inputs.build_only && !inputs.linux_only }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write  # scripts/quarantine checks each quarantined journey's owner issue (the Linux container has no gh)
    steps:
      - uses: actions/checkout@v4
      # Pin Xcode: the image's default moves. 26.6 ships the macOS 26.5 SDK.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: swift --version
      # The reference Lottie player LottiePlayerParityTests compares against
      # (scripts/lottie-oracle). The suite skips without it. build is a no-op
      # while VERSION and render.c match its stamp, so a cache hit needs no
      # meson or ninja. It lives in .build, so the tarball carries it to the tests.
      - name: Cache the Lottie oracle
        id: lottie-oracle
        uses: actions/cache@v4
        with:
          path: .build/lottie-oracle
          key: lottie-oracle-${{ runner.os }}-${{ hashFiles('scripts/lottie-oracle/VERSION', 'scripts/lottie-oracle/render.c') }}
      - name: Build the Lottie oracle
        run: |
          if [ "${{ steps.lottie-oracle.outputs.cache-hit }}" != true ]; then
            brew install meson ninja
          fi
          scripts/lottie-oracle/build
      - run: scripts/ci --build-only
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pack the build
        run: |
          command -v zstd >/dev/null || brew install zstd
          du -sh .build/*/debug/*.build 2>/dev/null | sort -h | tail -5
          du -sh .build
          time tar -cf - .build | zstd -T0 -3 -q -o "$RUNNER_TEMP/swift-build.tar.zst"
          ls -lh "$RUNNER_TEMP/swift-build.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: swift-build
          path: ${{ runner.temp }}/swift-build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # The release builds wrapped in signed .app bundles, for "Open on this Mac"
  # (`app-builds`), and the size baseline (blueprint 7.5): bytes per
  # executable, bundle and tarball, and SuiteUI symbols per executable, as
  # `size-report` and a table in the job summary; report only, it fails on a
  # script error or a missing bundle, never on a size. Its own job beside the
  # compile job, so it holds no shard; it is done before they start. A red
  # test job makes `macOS` delete `app-builds`, so a red run still ships no
  # bundles. A macOS gate run (mac_only) skips it: a pass/fail check on a
  # batch branch.
  mac-bundle:
    name: macOS bundles
    if: ${{ !inputs.build_only && !inputs.linux_only && !inputs.mac_only }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: scripts/bundle-apps
      - name: Upload app builds
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: .build/app-builds.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Size report
        run: |
          bash Tests/size_report/test_size_report.sh
          scripts/size-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: .build/size-report.json
          if-no-files-found: error

  # The macOS gate's test half, on the compile job's build. A full run: N
  # shards (the matrix below is N), each its own runner and `swift test`
  # process (scripts/ci --shard K/N: the K-th of the sorted suites, run as a
  # --changed scope is). Three, not more: the hosted macOS pool is 5 slots
  # shared with the lane's gates and the journeys, so with the compile and
  # bundles jobs a run peaks at 3 of them, and the long pole is the shard
  # holding the serialized BodyCountSuites (16 min) at any N.
  # Separate processes, so a MainActor hog in one shard
  # can't time out the suites in another (run 40266495039: every
  # HomeModelTests test hit its 60 s limit inside the one 8,500-test
  # process). fail-fast off: a red shard never cancels the others, so one run
  # names every failing test. A scoped run (`app`): one job running only
  # APP's tests (the step below; minutes, not worth a shard). Memory is
  # sampled every 20 s into memory.log; the Crash reports step prints it on
  # failure. Names start with "macOS" (the sentinel counts them) and never
  # fit "macOS (<apps>)", the gate job's.
  mac-test:
    name: macOS tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: mac-compile
    if: ${{ !inputs.build_only && !inputs.linux_only }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.app && '[1]' || '[1, 2, 3]') }}
    env:
      APP: ${{ inputs.app }}
      JOURNEYS_NOTE: ${{ inputs.mac_only && 'none (a lane batch gate runs no journeys)' || format('the `macOS journeys ({0})` job of the journeys.yml run this run starts on dev', inputs.app) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/download-artifact@v4
        with:
          name: swift-build
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: |
          command -v zstd >/dev/null || brew install zstd
          time zstd -dc "$RUNNER_TEMP/swift-build.tar.zst" | tar -xf -
          rm "$RUNNER_TEMP/swift-build.tar.zst"
      - name: scripts/ci --shard (memory sampled)
        if: ${{ !inputs.app }}
        run: |
          mem="$RUNNER_TEMP/crash-reports/memory.log"
          mkdir -p "$RUNNER_TEMP/crash-reports"
          echo "hw.memsize $(sysctl -n hw.memsize), hw.ncpu $(sysctl -n hw.ncpu)" >"$mem"
          (
            while true; do
              {
                echo "== $(date -u +%H:%M:%S)"
                vm_stat | head -10
                memory_pressure | tail -1
                ps -Ao rss=,pid=,comm= -m | head -5
              } >>"$mem" 2>&1
              sleep 20
            done
          ) >/dev/null 2>&1 &
          sampler=$!
          trap 'kill $sampler 2>/dev/null' EXIT
          scripts/ci --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
      # A scoped run instead: only APP's Model tests and its snapshot tests (a
      # macOS gate run's APP is a comma list: the union of those apps' tests)
      # (one at a time, as scripts/ci does). The filters come from
      # scripts/test-scope, the table scripts/ci --changed maps changed files
      # with; a snapshot test whose name fits no app runs in full runs only.
      # Perf tests are skipped (perf-nightly runs them). A filter that matches
      # no test fails the step. The job summary lists what ran.
      - name: Scoped tests
        if: inputs.app
        run: |
          scope=$(scripts/test-scope app "$APP")
          model=$(sed -n 1p <<<"$scope") snap=$(sed -n 2p <<<"$scope")
          perf=$(scripts/test-scope perf)
          {
            echo "## scoped: $APP"
            echo
            echo "Built every target with its tests and the five app bundles (the compile job). Ran only:"
            echo
            echo "- Model tests: \`swift test --filter '$model'\`"
            if [[ -n "$snap" ]]; then echo "- Snapshot tests: \`swift test --filter '$snap' --no-parallel\`"; else echo "- Snapshot tests: none"; fi
            echo "- UI journeys: $JOURNEYS_NOTE"
            echo "- Perf and timing tests: skipped (Tests/perf-suites.txt; they run nightly on the captain's Mac)"
            echo
            echo "Skipped: the Linux job (lints and every Model's tests), other apps' tests and journeys, and Promote and Dev red (a scoped run never moves main, and its journeys never lower the audit baseline)."
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          # run LABEL ARGS...: one swift test run without the perf tests; its result line goes in the summary.
          run() {
            local label=$1 log="$RUNNER_TEMP/scoped-$RANDOM.log" status
            shift
            echo "== swift test: $label"
            swift test --skip-build "$@" ${perf:+--skip "$perf"} 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "- $label: $(grep -E 'Test run with [0-9]+ tests?' "$log" | tail -1 || true)" >>"$GITHUB_STEP_SUMMARY"
            if (( status != 0 )); then
              python3 scripts/test-died "$log" || echo "::error::$label: the test process died with the tests above unfinished"
              exit "$status"
            fi
            grep -qE 'Test run with [1-9][0-9]* tests?' "$log" || { echo "::error::$label: the filter matched no tests"; exit 1; }
          }
          run "Model tests" --filter "$model"
          [[ -z "$snap" ]] || run "Snapshot tests" --filter "$snap" --no-parallel
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.shard }}
          path: .build/snapshots
          if-no-files-found: warn
      # On any failure, the crash reports macOS wrote for this job: a test
      # process that died (scripts/ci prints TEST PROCESS DIED) leaves an .ips
      # naming the crashed thread. The newest one's head goes in the log; all
      # of them go up as `crash-reports-K`.
      # It also prints the last 15 memory samples (all are uploaded), and the
      # newest JetsamEvent report's summary (scripts/jetsam-summary): macOS
      # writes one to /Library/Logs/DiagnosticReports when it kills processes
      # because memory ran out.
      - name: Crash reports
        if: failure()
        run: |
          out="$RUNNER_TEMP/crash-reports"
          mkdir -p "$out"
          shopt -s nullglob
          if [[ -f "$out/memory.log" ]]; then
            echo "== memory samples (the last 15 of $(grep -c '^== ' "$out/memory.log"))"
            awk '/^== /{n++} {line[NR]=$0; at[NR]=n} END{for(i=1;i<=NR;i++) if(at[i]==0 || at[i]>n-15) print line[i]}' "$out/memory.log"
          else
            echo "No memory samples"
          fi
          jetsam=(/Library/Logs/DiagnosticReports/JetsamEvent*.ips)
          if (( ${#jetsam[@]} > 0 )); then
            sudo cp "${jetsam[@]}" "$out/"
            sudo chown "$(id -u)" "$out"/JetsamEvent*.ips
            newest=$(ls -t "$out"/JetsamEvent*.ips | head -1)
            echo "== ${#jetsam[@]} JetsamEvent report(s); the newest, $(basename "$newest"):"
            scripts/jetsam-summary "$newest" || head -40 "$newest"
          else
            echo "No JetsamEvent reports in /Library/Logs/DiagnosticReports"
          fi
          reports=(~/Library/Logs/DiagnosticReports/*.ips)
          if (( ${#reports[@]} == 0 )); then
            echo "No crash reports in ~/Library/Logs/DiagnosticReports"
            exit 0
          fi
          cp "${reports[@]}" "$out/"
          newest=$(ls -t "${reports[@]}" | head -1)
          echo "== ${#reports[@]} crash report(s); the newest, $newest, first 60 lines:"
          head -60 "$newest"
      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-${{ matrix.shard }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 7

  # The gate job Promote, Dev red and the fast lane read ("macOS", or "macOS
  # (<apps>)" for a scoped or scoped gate run: MAC_JOB and MAC_GATE_RE in
  # scripts/fast-lane.sh): green once the compile job, every test job and the
  # bundles (when they run) passed. On ubuntu, after them, always (a red shard
  # must make it red, not skipped). Its summary lists each macOS job's
  # minutes. When red it deletes `app-builds`, so a red run ships no bundles.
  macos:
    name: ${{ inputs.app && format('macOS ({0})', inputs.app) || 'macOS' }}
    needs: [mac-compile, mac-test, mac-bundle]
    if: ${{ always() && !inputs.build_only && !inputs.linux_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # delete app-builds on red
      contents: read
    env:
      BUILD: ${{ needs.mac-compile.result }}
      TESTS: ${{ needs.mac-test.result }}
      BUNDLES: ${{ needs.mac-bundle.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Gate on the compile job, every test job and the bundles
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## macOS: compile $BUILD, tests $TESTS, bundles $BUNDLES"
            echo
            echo "| job | result | minutes |"
            echo "|---|---|---|"
            gh api "$run/jobs?per_page=100" --jq '.jobs[] | select((.name | startswith("macOS ")) and .conclusion != "skipped") | "| \(.name) | \(.conclusion // .status) | \(if .completed_at and .started_at then (((.completed_at | fromdate) - (.started_at | fromdate)) / 60 | floor) else "-" end) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$BUILD" == success && "$TESTS" == success && "$BUNDLES" =~ ^(success|skipped)$ ]] && exit 0
          for id in $(gh api "$run/artifacts" --jq '.artifacts[] | select(.name == "app-builds") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Deleted app-builds: a red run ships no bundles."
          done
          echo "::error::macOS: compile $BUILD, tests $TESTS, bundles $BUNDLES"
          exit 1

  # Fast-forward main to this dev SHA once the Linux and macOS jobs passed; the
  # journeys (journeys.yml) are report-only. The only job here that writes
  # contents.
  promote:
    name: Promote
    needs: [linux, macos]
    if: github.ref == 'refs/heads/dev' && !inputs.app && !inputs.mac_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push main
      issues: write    # close the dev-red issue
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "main already contains $GITHUB_SHA; nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has diverged from dev. main ($(git rev-parse --short origin/main)) has commits that dev ($(git rev-parse --short "$GITHUB_SHA")) lacks, so main cannot fast-forward. A hotfix probably landed on main: merge main into dev, and the next green dev run promotes. Commits only on main:"
            git log --oneline "$GITHUB_SHA..origin/main"
            exit 1
          fi
          # A plain push: the remote refuses anything but a fast-forward.
          git push origin "$GITHUB_SHA:refs/heads/main"
          for n in $(gh issue list --label dev-red --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "dev is green again at $GITHUB_SHA ($RUN_URL), and main now points there."
          done

  # Open, or update, the single "dev is red" issue when the Linux or macOS job
  # fails (journey reds go to Findings). main is the last green dev SHA, so main..SHA
  # holds the culprit. A run whose SHA main already contains (it finished after
  # a newer green run promoted past it) is stale: it logs the skip and touches no issue.
  dev-red:
    name: Dev red
    needs: [linux, macos]
    if: failure() && github.ref == 'refs/heads/dev' && !inputs.app && !inputs.mac_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open or update the dev-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::Skipped as stale: main ($(git rev-parse --short origin/main)) already contains $GITHUB_SHA, so a newer green run promoted past it. No dev-red issue opened or updated."
            exit 0
          fi
          range="main..$GITHUB_SHA"
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          # Lane and squash merges end their subject with (#N).
          prs=$(git log --format=%s "origin/$range" | grep -oE '\(#[0-9]+\)$' | tr -d '()' | sort -u | paste -sd' ' - || true)
          {
            echo "CI on dev is red, so main stays at the last green dev SHA ($(git rev-parse --short origin/main)). The fast lane keeps merging into dev; the next green dev run promotes main and closes this issue."
            echo
            echo "- Run: $RUN_URL"
            echo "- Failing jobs: $failed"
            echo "- Culprit range: \`$range\`"
            echo "- PRs in the range: ${prs:-none found}"
            echo
            echo "Commits in the range, newest first:"
            echo
            git log -n 100 --format='- %h %s' "origin/$range"
          } >"$RUNNER_TEMP/body.md"
          gh label create dev-red --color B60205 --description "CI on dev is red; main holds the last green dev SHA" 2>/dev/null || true
          n=$(gh issue list --label dev-red --state open --json number --jq '.[0].number // empty')
          if [[ -n "$n" ]]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "dev is red" --label dev-red --body-file "$RUNNER_TEMP/body.md"
          fi

  # Start the report-only journeys (journeys.yml) for this run's commit and
  # app once the gate jobs are done, red or green. A dispatch, not a
  # workflow_run trigger there, because CI runs the lane starts with
  # GITHUB_TOKEN fire no workflow_run; a GITHUB_TOKEN dispatch does start a
  # run. On dev only, never for a Linux check, build-only run or macOS gate.
  # continue-on-error: a failed dispatch is its own red check, not a red run.
  # Its name must not start with "macOS" (the sentinel counts those jobs).
  journeys-dispatch:
    name: Journeys dispatch
    needs: [linux, macos]
    if: ${{ !cancelled() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && !inputs.build_only && !inputs.linux_only && !inputs.mac_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write  # dispatch journeys.yml
    steps:
      - name: Dispatch journeys.yml
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
        run: |
          gh workflow run journeys.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f sha="$GITHUB_SHA" -f ci_run="$GITHUB_RUN_ID" ${APP:+-f app="$APP"}
          echo "Dispatched journeys.yml: ${APP:-every app} at $GITHUB_SHA (title \"after CI run $GITHUB_RUN_ID: ...\")." >>"$GITHUB_STEP_SUMMARY"
