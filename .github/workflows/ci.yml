# CI: runs scripts/ci on Linux (Model targets only; Package.swift declares the
# UI targets on macOS only) and on macOS 26 (everything, plus the snapshot
# PNGs uploaded as the `snapshots` artifact and the five release .app bundles
# from scripts/bundle-apps as the `app-builds` artifact, a tarball inside so
# the executables keep their +x bit, then the UI journeys on those bundles with
# their whole-window PNGs as the `ui-screens` artifact, with contact-sheet.html,
# the one page to review per run, inside it).
#
# Branch model: crew PRs merge into dev through the fast lane with no CI of
# their own; the worker's local scripts/ci (Models and lint, since SwiftUI
# can't compile on Linux) is the per-PR check. This workflow runs on dev once a
# feature is built, not after every merge: on workflow_dispatch (the supervisor
# or Belt, e.g. after an integrate PR), when the lane merges a PR labelled
# `feature-done` (it dispatches this once), and daily as a safety net. When
# both jobs are green, `promote` fast-forwards main to that exact SHA, so main
# only holds tested dev SHAs and is the last green. When a job is red,
# `dev-red` opens or updates one "dev is red" issue with the culprit range
# main..SHA; the next promotion closes it. No push trigger: main only receives
# tested SHAs, and a push trigger on dev would fire per merge. pull_request
# runs only for rare hotfix PRs to main. The app audit only fails a count that
# rose; when the journeys measure counts under the baseline, `audit-lower`
# pushes one commit to dev that lowers it.
#
# Trade-off: SwiftUI breakage, snapshot and UI journey failures sit on dev
# until the next feature run, so a dev-red culprit range can span several PRs.
#
# Scoped run (workflow_dispatch with `app`: flare, design, photo, library,
# halo, suite or suiteui): the macOS job still builds every target with its
# tests, the five app bundles and every journey bundle, but runs only that
# app's Model tests, snapshot tests and UI journeys, so another app's red test
# can't hide it. The Linux job (lints and every Model's tests) is skipped, and
# a scoped run never promotes main, opens dev-red or lowers the audit
# baseline. belt-pilot's verify-dispatch.sh dispatches one on dev after an
# app's merges.
#
# The fast lane also counts a passing check from this workflow ("CI") on a PR
# head and reads the job names "Linux", "macOS" and "macOS build" and the
# run title "macOS build", so keep them stable. A scoped run's macOS job is
# named "macOS (<app>)" so the lane never takes it as a full macOS result.
name: CI
# A build-only run (the fast lane's compile check for code PRs) and a scoped
# run ("scoped: <app>", how verify-dispatch.sh finds them) get their own
# titles; " " keeps the default title.
run-name: "${{ inputs.build_only && 'macOS build' || inputs.app && format('scoped: {0}', inputs.app) || ' ' }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Only build every target on macOS (the fast lane's compile check for code PRs)
        type: boolean
        default: false
      app:
        description: 'Scope to one app: flare, design, photo, library, halo, suite or suiteui (empty: the full run)'
        type: string
        default: ''
  schedule:
    - cron: '17 4 * * *'  # daily; schedule runs on the default branch (dev)

permissions:
  contents: read

# Runs on dev and main never cancel: GitHub keeps the running one plus the
# newest pending one, so dispatches that pile up collapse into one run (macOS
# runners are a small shared pool). PR runs group by PR number, so a hotfix PR
# from a branch named dev can't cancel a dev run. Each scoped app gets its own
# group, so a Design run never displaces a pending Photo or full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}${{ inputs.build_only && '-build' || '' }}${{ inputs.app && format('-{0}', inputs.app) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  linux:
    name: Linux
    if: ${{ !inputs.build_only && !inputs.app }}
    runs-on: ubuntu-latest
    # Official image; 6.3.3-noble is Ubuntu 24.04, the same OS as the cloud agents.
    container: swift:6.3.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - { uses: actions/setup-node@v4, with: { node-version: 22 } } # jscpd duplicate check; the swift image has no node
      # scripts/ci's C4 ownership check and the fast lane's decision tests need
      # jq, and its C4 assembly and waves checks need python3; the swift image
      # may lack both.
      - run: apt-get update -q && apt-get install -y -q jq python3
      - run: swift --version
      - run: scripts/ci
      - run: bash Tests/fast_lane/test_fast_lane.sh

  # The fast lane's compile check for a PR that changes code (BUILD_RE in
  # scripts/fast-lane.sh: Swift under Sources/, Tests/ and UITests/,
  # project.yml, Package.swift). It compiles everything and runs nothing:
  # every SwiftPM target with its tests, then the journey bundles from
  # project.yml. Only on workflow_dispatch with build_only.
  mac-build:
    name: macOS build
    if: ${{ inputs.build_only }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: swift build --build-tests
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate --quiet
      - run: xcodebuild build-for-testing -project CreativeApps.xcodeproj -scheme Journeys -destination platform=macOS

  macos:
    name: ${{ inputs.app && format('macOS ({0})', inputs.app) || 'macOS' }}
    if: ${{ !inputs.build_only }}
    runs-on: macos-26
    # scripts/ci alone takes about 20 min under load and the five apps' UI
    # journeys about 30 more; 45 cut ui-test off mid-run (dev run 38792928305).
    timeout-minutes: 90
    # issues: read lets scripts/quarantine check that each quarantined
    # journey's owner issue is still open (the Linux container has no gh).
    permissions:
      contents: read
      issues: read
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      # Pin Xcode: the image's default moves. 26.6 ships the macOS 26.5 SDK.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: swift --version
      # scripts/ci with a memory sample every 20 s into memory.log: the time,
      # vm_stat's page counts, the system-wide free percentage and the five
      # largest processes by resident memory. The Crash reports step prints
      # it on failure, since a step killed for memory leaves no output of its own.
      - name: scripts/ci (memory sampled)
        if: ${{ !inputs.app }}
        run: |
          mem="$RUNNER_TEMP/crash-reports/memory.log"
          mkdir -p "$RUNNER_TEMP/crash-reports"
          echo "hw.memsize $(sysctl -n hw.memsize), hw.ncpu $(sysctl -n hw.ncpu)" >"$mem"
          (
            while true; do
              {
                echo "== $(date -u +%H:%M:%S)"
                vm_stat | head -10
                memory_pressure | tail -1
                ps -Ao rss=,pid=,comm= -m | head -5
              } >>"$mem" 2>&1
              sleep 20
            done
          ) >/dev/null 2>&1 &
          sampler=$!
          trap 'kill $sampler 2>/dev/null' EXIT
          scripts/ci
        env:
          GH_TOKEN: ${{ github.token }}
      # A scoped run instead: build every target with its tests, then run only
      # APP's Model tests and its snapshot tests (one at a time, as scripts/ci
      # does). swift test --filter matches <target>.<suite>/<test>() or
      # <target>.<test>() for a free function. Snapshot suites are named after
      # their app; the alternations add Flare's and SuiteUI's suites and free
      # tests that aren't, and each app's test in the AppSnapshotTests suite. A
      # snapshot test whose name fits no app runs in full runs only. A filter
      # that matches no test fails the step. The job summary lists what ran.
      - name: Scoped build and tests
        if: inputs.app
        id: scope
        run: |
          snap_flare='(Flare[A-Za-z]*|AutosaveTests|AutosaveRecoveryTests|PlaybackDriverTests|StagePathTests)/|AppSnapshotTests/flare\('
          snap_suiteui='(Suite[A-Za-z]*|GoldenImageTests|SnapshotHostTests)/|(suite[A-Za-z]*|snapshotsDrawRealSlidersNotPlaceholders|theCapsuleDrawsOnlyBehindTheCurrentItem|aDisabledBarCommandDrawsDimmerThanAnEnabledOne)\(|AppSnapshotTests/suiteGallery\('
          journeys=""
          case "$APP" in
            flare)   model=FlareModelTests;   snap=$snap_flare;                                    journeys=FlareJourneyTests ;;
            design)  model=DesignModelTests;  snap='Design[A-Za-z]*/|AppSnapshotTests/design\(';   journeys=DesignJourneyTests ;;
            photo)   model=PhotoModelTests;   snap='Photo[A-Za-z]*/|AppSnapshotTests/photo\(';     journeys=PhotoJourneyTests ;;
            library) model=LibraryModelTests; snap='Library[A-Za-z]*/|AppSnapshotTests/library\('; journeys=LibraryJourneyTests ;;
            halo)    model=HaloModelTests;    snap='Halo[A-Za-z]*/|AppSnapshotTests/halo\(';       journeys=HaloJourneyTests ;;
            suite)   model=SuiteModelTests;   snap="" ;;  # AfterGlow and SuiteModel: no snapshots or journey bundle yet
            suiteui) model='SuiteUITests|AppAuditTests'; snap=$snap_suiteui;                      journeys=SuiteJourneyTests ;;
            *) echo "::error::app '$APP' is not one of flare, design, photo, library, halo, suite, suiteui"; exit 1 ;;
          esac
          model="^($model)\."
          [[ -z "$snap" ]] || snap="^AppSnapshotTests\.($snap)"
          echo "journeys=$journeys" >>"$GITHUB_OUTPUT"
          {
            echo "## scoped: $APP"
            echo
            echo "Built every target with its tests, the five app bundles and every journey bundle. Ran only:"
            echo
            echo "- Model tests: \`swift test --filter '$model'\`"
            if [[ -n "$snap" ]]; then echo "- Snapshot tests: \`swift test --filter '$snap' --no-parallel\`"; else echo "- Snapshot tests: none"; fi
            if [[ -n "$journeys" ]]; then echo "- UI journeys: \`scripts/ui-test -only-testing:$journeys\` (quarantined ones still skipped)"; else echo "- UI journeys: none"; fi
            echo
            echo "Skipped: the Linux job (lints and every Model's tests), other apps' tests and journeys, and Promote, Dev red and Audit lower (a scoped run never moves main or the audit baseline)."
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          swift build --build-tests
          # run LABEL ARGS...: one swift test run; its result line goes in the summary.
          run() {
            local label=$1 log="$RUNNER_TEMP/scoped-$RANDOM.log" status
            shift
            echo "== swift test: $label"
            swift test --skip-build "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "- $label: $(grep -E 'Test run with [0-9]+ tests?' "$log" | tail -1 || true)" >>"$GITHUB_STEP_SUMMARY"
            if (( status != 0 )); then
              python3 scripts/test-died "$log" || echo "::error::$label: the test process died with the tests above unfinished"
              exit "$status"
            fi
            grep -qE 'Test run with [1-9][0-9]* tests?' "$log" || { echo "::error::$label: the filter matched no tests"; exit 1; }
          }
          run "Model tests" --filter "$model"
          [[ -z "$snap" ]] || run "Snapshot tests" --filter "$snap" --no-parallel
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: .build/snapshots
          if-no-files-found: warn
      # Release builds wrapped in signed .app bundles, for "Open on this Mac".
      # Runs only after scripts/ci passed, so a red build never ships bundles.
      - run: scripts/bundle-apps
      - name: Upload app builds
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: .build/app-builds.tar.gz
          retention-days: 7
          if-no-files-found: error
      # The size baseline (blueprint 7.5): bytes per executable, bundle and
      # tarball, and SuiteUI symbols per executable, as `size-report` and a
      # table in the job summary. Report only: it fails on a script error or a
      # missing bundle, never on a size.
      - name: Size report
        run: |
          bash Tests/size_report/test_size_report.sh
          scripts/size-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: .build/size-report.json
          if-no-files-found: error
      # The human-like UI tests: scripts/ui-test launches the bundles above,
      # clicks through each app (UITests/) and exports a whole-window PNG per
      # step, uploaded as `ui-screens`. A failed journey fails this job.
      # XcodeGen is a pinned release, checked against its sha256 (Homebrew
      # can't pin a version). automationmodetool lets the test runner drive
      # the UI without a password prompt.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: sudo automationmodetool enable-automationmode-without-authentication
      # A scoped run builds every journey bundle first, so a shared change
      # that breaks another app's journeys still fails it, then runs only
      # APP's bundle (suite has none yet). scripts/ui-test passes
      # -only-testing to xcodebuild and still skips quarantined journeys.
      - name: Build every journey bundle
        if: inputs.app
        run: |
          xcodegen generate --quiet
          xcodebuild build-for-testing -project CreativeApps.xcodeproj -scheme Journeys -destination platform=macOS
      - id: ui
        if: ${{ !inputs.app || steps.scope.outputs.journeys != '' }}
        env:
          JOURNEYS: ${{ steps.scope.outputs.journeys }}
        run: scripts/ui-test ${JOURNEYS:+"-only-testing:$JOURNEYS"}
      # The page to review: every journey step with its audit, each app's
      # audit counts against the baseline and the perf reports, written into
      # ui-screens, plus a short table in the job summary. Runs when a journey
      # failed too, since that's when the sheet matters most.
      # A scoped run's sheet compares only APP against its baseline (the other
      # apps didn't run), and its branch reads "dev (scoped: APP)" so the sheet
      # doesn't promise an Audit lower that a scoped run skips.
      - name: Contact sheet
        if: always() && steps.ui.outcome != 'skipped'
        run: |
          if [[ -z "$APP" ]]; then scripts/contact-sheet; exit; fi
          base="$RUNNER_TEMP/audit-baseline.json"
          jq --arg a "$APP" 'with_entries(select(.key == $a))' UITests/audit-baseline.json >"$base"
          GITHUB_REF_NAME="$GITHUB_REF_NAME (scoped: $APP)" scripts/contact-sheet .build/ui-screens "$base"
      - name: Upload UI screens
        if: always() && steps.ui.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: .build/ui-screens
          if-no-files-found: warn
      # On a failed journey, the result bundle: the UI hierarchy and a screen
      # recording at the failure (open in Xcode or `xcrun xcresulttool`).
      - name: Upload UI test results
        if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: .build/ui-tests.xcresult
          retention-days: 7
      # On any failure, the crash reports macOS wrote for this job: a test
      # process that died (scripts/ci prints TEST PROCESS DIED) leaves an .ips
      # naming the crashed thread. The newest one's head goes in the log; all
      # of them go up as `crash-reports`.
      # It also prints the last 15 memory samples (all are uploaded), and the
      # newest JetsamEvent report's summary (scripts/jetsam-summary): macOS
      # writes one to /Library/Logs/DiagnosticReports when it kills processes
      # because memory ran out.
      - name: Crash reports
        if: failure()
        run: |
          out="$RUNNER_TEMP/crash-reports"
          mkdir -p "$out"
          shopt -s nullglob
          if [[ -f "$out/memory.log" ]]; then
            echo "== memory samples (the last 15 of $(grep -c '^== ' "$out/memory.log"))"
            awk '/^== /{n++} {line[NR]=$0; at[NR]=n} END{for(i=1;i<=NR;i++) if(at[i]==0 || at[i]>n-15) print line[i]}' "$out/memory.log"
          else
            echo "No memory samples"
          fi
          jetsam=(/Library/Logs/DiagnosticReports/JetsamEvent*.ips)
          if (( ${#jetsam[@]} > 0 )); then
            sudo cp "${jetsam[@]}" "$out/"
            sudo chown "$(id -u)" "$out"/JetsamEvent*.ips
            newest=$(ls -t "$out"/JetsamEvent*.ips | head -1)
            echo "== ${#jetsam[@]} JetsamEvent report(s); the newest, $(basename "$newest"):"
            scripts/jetsam-summary "$newest" || head -40 "$newest"
          else
            echo "No JetsamEvent reports in /Library/Logs/DiagnosticReports"
          fi
          reports=(~/Library/Logs/DiagnosticReports/*.ips)
          if (( ${#reports[@]} == 0 )); then
            echo "No crash reports in ~/Library/Logs/DiagnosticReports"
            exit 0
          fi
          cp "${reports[@]}" "$out/"
          newest=$(ls -t "${reports[@]}" | head -1)
          echo "== ${#reports[@]} crash report(s); the newest, $newest, first 60 lines:"
          head -60 "$newest"
      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 7

  # Fast-forward main to this dev SHA once every job above passed. The only
  # job besides audit-lower (which pushes one baseline commit to dev) that
  # writes contents.
  promote:
    name: Promote
    needs: [linux, macos]
    if: github.ref == 'refs/heads/dev' && !inputs.app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push main
      issues: write    # close the dev-red issue
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "main already contains $GITHUB_SHA; nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has diverged from dev. main ($(git rev-parse --short origin/main)) has commits that dev ($(git rev-parse --short "$GITHUB_SHA")) lacks, so main cannot fast-forward. A hotfix probably landed on main: merge main into dev, and the next green dev run promotes. Commits only on main:"
            git log --oneline "$GITHUB_SHA..origin/main"
            exit 1
          fi
          # A plain push: the remote refuses anything but a fast-forward.
          git push origin "$GITHUB_SHA:refs/heads/main"
          for n in $(gh issue list --label dev-red --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "dev is green again at $GITHUB_SHA ($RUN_URL), and main now points there."
          done

  # Open, or update, the single "dev is red" issue. main is the last green dev
  # SHA, so main..SHA holds the culprit.
  dev-red:
    name: Dev red
    needs: [linux, macos]
    if: failure() && github.ref == 'refs/heads/dev' && !inputs.app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open or update the dev-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin main
          range="main..$GITHUB_SHA"
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          # Lane and squash merges end their subject with (#N).
          prs=$(git log --format=%s "origin/$range" | grep -oE '\(#[0-9]+\)$' | tr -d '()' | sort -u | paste -sd' ' - || true)
          {
            echo "CI on dev is red, so main stays at the last green dev SHA ($(git rev-parse --short origin/main)). The fast lane keeps merging into dev; the next green dev run promotes main and closes this issue."
            echo
            echo "- Run: $RUN_URL"
            echo "- Failing jobs: $failed"
            echo "- Culprit range: \`$range\`"
            echo "- PRs in the range: ${prs:-none found}"
            echo
            echo "Commits in the range, newest first:"
            echo
            git log -n 100 --format='- %h %s' "origin/$range"
          } >"$RUNNER_TEMP/body.md"
          gh label create dev-red --color B60205 --description "CI on dev is red; main holds the last green dev SHA" 2>/dev/null || true
          n=$(gh issue list --label dev-red --state open --json number --jq '.[0].number // empty')
          if [[ -n "$n" ]]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "dev is red" --label dev-red --body-file "$RUNNER_TEMP/body.md"
          fi

  # The app audit's way down (docs/blueprints/app-audit.md, "The ratchet"): a
  # count under its baseline doesn't fail the journeys, so on dev this writes
  # the counts the run measured (audit-counts.json in ui-screens) into
  # UITests/audit-baseline.json with scripts/audit-lower and pushes that one
  # commit straight to dev, the way promote pushes main. scripts/audit-lower
  # refuses any count over its baseline, so this can only tighten the audit.
  # It runs only after a green macOS job: a failed journey leaves its later
  # screens unaudited, so its counts are too low to trust. When dev moved
  # during the run the push is refused; it fetches dev and lowers again on top,
  # judging only checks still at the number they were measured against (the
  # third argument), up to 3 retries. GITHUB_TOKEN pushes start no workflow.
  audit-lower:
    name: Audit lower
    needs: [macos]
    if: github.ref == 'refs/heads/dev' && !inputs.app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push the lowered baseline to dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-screens, path: ui-screens }
      - name: Lower the baselines to the measured counts
        run: |
          title="test(audit): lower baselines to the measured counts"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          measured="$RUNNER_TEMP/measured-baseline.json"
          cp UITests/audit-baseline.json "$measured"  # the checkout is $GITHUB_SHA, what the journeys ran
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            rows=$(scripts/audit-lower UITests/audit-baseline.json ui-screens/audit-counts.json "$measured")
            if [[ -z "$rows" ]]; then
              echo "Audit: nothing to lower." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            table=$(printf '| app | check | old | new |\n|---|---|---:|---:|\n%s\n' "$rows")
            git commit -q -m "$title" -m "Measured by the macOS journeys in $run_url at $GITHUB_SHA." -m "$table" UITests/audit-baseline.json
            if git push origin HEAD:refs/heads/dev; then
              printf 'Audit: pushed %s to dev, lowering the baseline.\n\n%s\n' "$(git rev-parse --short HEAD)" "$table" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push $attempt refused (dev moved); lowering again on top of the new dev."
            git fetch -q origin dev
            git checkout -q --detach FETCH_HEAD
          done
          echo "::error::Could not push the lowered baseline to dev after 3 retries."
          exit 1
