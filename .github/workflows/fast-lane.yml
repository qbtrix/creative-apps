# Fast lane: squash-merge small, checked, allowlisted PRs labelled `fast-lane`
# into dev. All logic lives in scripts/fast-lane.sh; agent rules in CLAUDE.md.
# Full CI runs on dev once a feature is built (the lane dispatches it after
# merging a `feature-done` PR), and ci.yml's `promote` job moves main to a dev
# SHA only when that run is green.
#
# Safety: this workflow never runs PR code. It checks out only the lane's
# scripts from main (green, promoted code) and talks to the GitHub API. For a
# PR that conflicts with dev it clones the repo into a scratch folder, merges
# dev into the PR head with git and main's merge drivers, and pushes the result
# to the PR branch (contents: write); nothing from that tree is executed.
# Ready PRs are merged the same way onto a scratch `lane/batch-<id>` branch
# that gets one Linux-only CI run and, when it has code, one macOS gate run
# (ci.yml `mac_only`, scoped to the batch's apps) before they land (and `-<i>`
# probes of its prefixes when it is red). The batch knobs come from repo
# variables (Settings, Variables): LANE_MAC_PER_PR=1 restores the per-PR
# macOS build and Linux-only batches; LANE_MAC_SLOTS, LANE_BATCH_MAX and
# LANE_BATCH_WAIT_MIN tune batching (empty: the defaults in
# scripts/fast-lane.sh); LANE_KILN=1 holds a batch's mac_only run up to
# LANE_KILN_WAIT_MIN (20) minutes for a local Mac check that posts
# local-ci/macos; LANE_VERIFY_AFTER=1 turns on verify after merge
# (docs/fast-lane.md: a code PR lands alone on its Linux proof plus the
# local-ci/prescreen status, and a red dev's culprit is reverted in a
# lane-revert PR the lane opens and lands). While a `dev-red` issue is open the sweep
# also bisects dev's culprit range with `ci/bisect-<sha>-<i>` branches, one
# Linux-only run each. The sweep waits up to 7 minutes for such a run, so the
# job's timeout leaves room for it. workflow_run and schedule fire from the copy of this file on the default
# branch, so those triggers follow whatever branch is the default (dev).
name: Fast Lane

on:
  pull_request_target:
    # edited: the worker updates the Fast-Check marker in the body after a push.
    types: [labeled, synchronize, edited, ready_for_review]
    # main too, so a fast-lane PR opened against main gets retargeted to dev.
    branches: [dev, main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Heartbeat: CI runs started by GITHUB_TOKEN fire no workflow_run, and a
  # marker edited while a sweep runs would wait for the next event. A sweep
  # every 5 minutes closes both gaps. Free on a public repo.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (empty = every open fast-lane PR)
        required: false

permissions:
  issues: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write  # dispatch CI on dev after merging a feature-done PR

# Every run sweeps every open fast-lane PR, so one lane at a time is enough:
# GitHub keeps the running sweep plus the newest pending one, and two sweeps
# never race to merge the same PR.
concurrency:
  group: fast-lane
  cancel-in-progress: false

jobs:
  fast-lane:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action == 'labeled' && github.event.label.name == 'fast-lane') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'fast-lane'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          # The lane's own code, the merge drivers it installs in the scratch
          # clone that integrates a conflicting PR, and the canonical-first
          # and SuiteUI-first checks with their concept lists, and test-scope,
          # which names the apps a code PR's macOS build compiles: all from
          # main, never the PR.
          sparse-checkout: |
            scripts/fast-lane.sh
            scripts/test-scope
            scripts/install-merge-drivers
            scripts/merge-json
            scripts/check-dup-logic
            Tests/canonical-concepts.txt
            scripts/check-dup-views
            Tests/canonical-ui-concepts.txt
          sparse-checkout-cone-mode: false
      - name: Sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          LANE_MAC_PER_PR: ${{ vars.LANE_MAC_PER_PR }}
          LANE_MAC_SLOTS: ${{ vars.LANE_MAC_SLOTS }}
          LANE_BATCH_MAX: ${{ vars.LANE_BATCH_MAX }}
          LANE_BATCH_WAIT_MIN: ${{ vars.LANE_BATCH_WAIT_MIN }}
          LANE_VERIFY_AFTER: ${{ vars.LANE_VERIFY_AFTER }}
          LANE_KILN: ${{ vars.LANE_KILN }}
          LANE_KILN_WAIT_MIN: ${{ vars.LANE_KILN_WAIT_MIN }}
        run: bash scripts/fast-lane.sh ${PR_INPUT:+"$PR_INPUT"}
