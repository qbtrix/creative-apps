<?xml version="1.0" encoding="UTF-8"?>
<!-- Bundle/Marks/Photo.svg: the Photo app mark, the only hand-edited form of it.
     scripts/render-marks turns it into Bundle/Icons/Photo*.png and SuiteUI's AppMarkArt.swift.
     Groups: photo-tile (1024 grid, 824 tile inset 100), photo-tile-small (the rim drawn at 32 px and under),
     photo-glyph (44-unit grid), photo-glyph-small (32 px and under), photo-line (24-unit monoline, currentColor). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Photo: framed hills and a sun">
  <defs>
    <radialGradient id="photo-tile-fill" cx="0.28" cy="0" r="1.1" fx="0.28" fy="0"><stop offset="0" stop-color="#3b3b41"/><stop offset="0.46" stop-color="#1d1d20"/><stop offset="1" stop-color="#0a0a0b"/></radialGradient>
    <linearGradient id="photo-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.11"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="photo-paint" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="37"><stop offset="0" stop-color="#c8f7a6"/><stop offset="0.5" stop-color="#34d17a"/><stop offset="1" stop-color="#0e9f74"/></linearGradient>
    <linearGradient id="photo-paint-small" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="37"><stop offset="0" stop-color="#c8f7a6"/><stop offset="1" stop-color="#34d17a"/></linearGradient>
  </defs>
  <g id="photo-tile">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#photo-tile-fill)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#photo-sheen)"/>
    <rect x="104" y="104" width="816" height="816" rx="181" ry="181" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="8"/>
  </g>
  <g id="photo-tile-small" display="none">
    <rect x="122" y="122" width="780" height="780" rx="163" ry="163" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="44"/>
  </g>
  <g id="photo-glyph" transform="translate(232 232) scale(12.7273)">
    <rect x="5.5" y="8.5" width="33" height="27" rx="7" fill="none" stroke="url(#photo-paint)" stroke-width="3.4"/>
    <path d="M10 31.5 L18 21.5 L24 28 L28.5 23.5 L34.5 31.5 Z" fill="url(#photo-paint)"/>
    <circle cx="29.5" cy="16.5" r="3.6" fill="#c8f7a6"/>
  </g>
  <g id="photo-glyph-small" display="none" transform="translate(180 180) scale(15.0909)">
    <rect x="4" y="7" width="36" height="30" rx="7" fill="none" stroke="url(#photo-paint-small)" stroke-width="4.6"/>
    <path d="M8.5 33 L18 20.5 L25 28 L29.5 23.5 L35.5 33 Z" fill="url(#photo-paint-small)"/>
    <circle cx="30" cy="15.5" r="4.2" fill="#c8f7a6"/>
  </g>
  <g id="photo-line" display="none" transform="translate(232 232) scale(23.3333)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="4"/><path d="M6.6 17l3.9-4.9 2.9 3.1 2.2-2.1L18 17"/><circle cx="15.6" cy="9.2" r="1.5"/></g>
</svg>
