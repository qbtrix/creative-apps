<?xml version="1.0" encoding="UTF-8"?>
<!-- Bundle/Marks/AfterGlow.svg: the AfterGlow app mark, the only hand-edited form of it.
     scripts/render-marks turns it into Bundle/Icons/AfterGlow*.png and SuiteUI's AppMarkArt.swift.
     Groups: afterglow-tile (1024 grid, 824 tile inset 100), afterglow-tile-small (the rim drawn at 32 px and under),
     afterglow-glyph (44-unit grid), afterglow-glyph-small (32 px and under), afterglow-line (24-unit monoline, currentColor). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="AfterGlow, the suite: a sun past the horizon">
  <defs>
    <radialGradient id="afterglow-tile-fill" cx="0.28" cy="0" r="1.1" fx="0.28" fy="0"><stop offset="0" stop-color="#3b3b41"/><stop offset="0.46" stop-color="#1d1d20"/><stop offset="1" stop-color="#0a0a0b"/></radialGradient>
    <linearGradient id="afterglow-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.11"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="afterglow-paint" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="38"><stop offset="0" stop-color="#ffe066"/><stop offset="0.5" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
    <linearGradient id="afterglow-paint-small" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="38"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
  </defs>
  <g id="afterglow-tile">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#afterglow-tile-fill)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#afterglow-sheen)"/>
    <rect x="104" y="104" width="816" height="816" rx="181" ry="181" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="8"/>
  </g>
  <g id="afterglow-tile-small" display="none">
    <rect x="122" y="122" width="780" height="780" rx="163" ry="163" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="44"/>
  </g>
  <g id="afterglow-glyph" transform="translate(232 232) scale(12.7273)">
    <path d="M8 26 A14 14 0 0 1 36 26 Z" fill="url(#afterglow-paint)"/>
    <path d="M5 30.6 H39" stroke="url(#afterglow-paint)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M12 36 H32" stroke="url(#afterglow-paint)" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/>
  </g>
  <g id="afterglow-glyph-small" display="none" transform="translate(180 180) scale(15.0909)">
    <path d="M7 25 A15 15 0 0 1 37 25 Z" fill="url(#afterglow-paint-small)"/>
    <path d="M3.5 31.5 H40.5" stroke="url(#afterglow-paint-small)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="afterglow-line" display="none" transform="translate(232 232) scale(23.3333)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13.5 A7 7 0 0 1 19 13.5"/><path d="M3 16.8 H21"/><path d="M6.5 19.6 H17.5" opacity="0.6"/></g>
</svg>
