<?xml version="1.0" encoding="UTF-8"?>
<!-- Bundle/Marks/Library.svg: the Library app mark, the only hand-edited form of it.
     scripts/render-marks turns it into Bundle/Icons/Library*.png and SuiteUI's AppMarkArt.swift.
     Groups: library-tile (1024 grid, 824 tile inset 100), library-tile-small (the rim drawn at 32 px and under),
     library-glyph (44-unit grid), library-glyph-small (32 px and under), library-line (24-unit monoline, currentColor). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Library: a starred card on a stack">
  <defs>
    <radialGradient id="library-tile-fill" cx="0.28" cy="0" r="1.1" fx="0.28" fy="0"><stop offset="0" stop-color="#3b3b41"/><stop offset="0.46" stop-color="#1d1d20"/><stop offset="1" stop-color="#0a0a0b"/></radialGradient>
    <linearGradient id="library-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.11"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="library-paint" gradientUnits="userSpaceOnUse" x1="0" y1="7" x2="0" y2="37"><stop offset="0" stop-color="#fff2a6"/><stop offset="0.5" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
    <linearGradient id="library-paint-small" gradientUnits="userSpaceOnUse" x1="0" y1="7" x2="0" y2="37"><stop offset="0" stop-color="#fff2a6"/><stop offset="1" stop-color="#ffd60a"/></linearGradient>
  </defs>
  <g id="library-tile">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#library-tile-fill)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#library-sheen)"/>
    <rect x="104" y="104" width="816" height="816" rx="181" ry="181" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="8"/>
  </g>
  <g id="library-tile-small" display="none">
    <rect x="122" y="122" width="780" height="780" rx="163" ry="163" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="44"/>
  </g>
  <g id="library-glyph" transform="translate(232 232) scale(12.7273)">
    <path d="M13 8.5 H33.5 a4.5 4.5 0 0 1 4.5 4.5 V30" fill="none" stroke="url(#library-paint)" stroke-width="3.4" stroke-linecap="round" opacity="0.6"/>
    <rect x="6" y="14" width="27" height="23" rx="5.5" fill="url(#library-paint)"/>
    <path d="M19.5 18 L21.6 22.6 L26.6 23.1 L22.8 26.4 L23.9 31.3 L19.5 28.7 L15.1 31.3 L16.2 26.4 L12.4 23.1 L17.4 22.6 Z" fill="#3a2600"/>
  </g>
  <g id="library-glyph-small" display="none" transform="translate(180 180) scale(15.0909)">
    <path d="M12 7 H34 a5 5 0 0 1 5 5 V30" fill="none" stroke="url(#library-paint-small)" stroke-width="4.6" stroke-linecap="round" opacity="0.7"/>
    <rect x="4" y="13" width="29" height="26" rx="6" fill="url(#library-paint-small)"/>
    <path d="M18.5 18.5 L20.5 23.75 L26.11 24.03 L21.73 27.55 L23.2 32.97 L18.5 29.9 L13.8 32.97 L15.27 27.55 L10.89 24.03 L16.5 23.75 Z" fill="#3a2600"/>
  </g>
  <g id="library-line" display="none" transform="translate(232 232) scale(23.3333)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h9.4A2.6 2.6 0 0 1 20 6.6V15"/><rect x="3.5" y="7.5" width="13" height="12.5" rx="3"/><path d="M10 10.8l.95 1.95 2.15.3-1.55 1.5.37 2.1L10 15.65l-1.92 1 .37-2.1-1.55-1.5 2.15-.3z" fill="#fff" stroke-width="1"/></g>
</svg>
